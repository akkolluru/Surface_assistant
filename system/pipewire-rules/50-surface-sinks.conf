# PipeWire virtual sinks routed to the default physical output.
# Separates Alarm (100% default), TTS (50% default), and Media (rocker-controlled)
# into independent, user-adjustable streams.

context.modules = [
  {
    name = libpipewire-module-loopback
    args = {
      node.description = "Surface Alarm Audio"
      capture.props = {
        node.name = "alarm-sink"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "alarm-sink.output"
        node.passive = true
      }
    }
  }
  {
    name = libpipewire-module-loopback
    args = {
      node.description = "Surface Voice TTS"
      capture.props = {
        node.name = "tts-sink"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "tts-sink.output"
        node.passive = true
      }
    }
  }
  {
    name = libpipewire-module-loopback
    args = {
      node.description = "Surface Media Playback"
      capture.props = {
        node.name = "media-sink"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "media-sink.output"
        node.passive = true
      }
    }
  }
]
