homeassistant:
  name: Surface Bedside Hub
  time_zone: Asia/Kolkata
  unit_system: metric

default_config:

http:
  cors_allowed_origins:
    - http://127.0.0.1:8000
    - http://localhost:8000
    - http://127.0.0.1:5173
    - http://localhost:5173

conversation:

intent_script: !include intent_script.yaml
scene: !include scenes.yaml

# Placeholder Smart Home Entities for Pane 2 (drop-in replacement when physical devices are added)
input_boolean:
  bedroom_main_light:
    name: Bedroom Ceiling Light
    icon: mdi:ceiling-light
    initial: false
  bedside_lamp:
    name: Bedside Warm Lamp
    icon: mdi:lamp
    initial: false
  bedroom_ac_power:
    name: Bedroom AC
    icon: mdi:air-conditioner
    initial: false
  desk_plug:
    name: Desk Smart Plug
    icon: mdi:power-socket-uk
    initial: false
  fan_plug:
    name: Standing Fan Plug
    icon: mdi:fan
    initial: false

input_number:
  bedroom_light_brightness:
    name: Ceiling Brightness
    min: 5
    max: 100
    step: 5
    initial: 60
    unit_of_measurement: "%"
    icon: mdi:brightness-6
  bedroom_ac_temp:
    name: AC Target Temperature
    min: 18
    max: 30
    step: 1
    initial: 24
    unit_of_measurement: "°C"
    icon: mdi:thermometer

input_select:
  bedroom_ac_mode:
    name: AC Mode
    options:
      - Cool
      - Dry
      - Fan
      - Eco
    initial: Cool
    icon: mdi:snowflake

# Localhost bridge commands to the Surface Python Companion Daemon
rest_command:
  surface_open_media:
    url: http://127.0.0.1:8000/api/media/launch
    method: POST
    content_type: application/json
    payload: '{"tile_id": "{{ tile_id }}"}'

  surface_return_home:
    url: http://127.0.0.1:8000/api/media/home
    method: POST

  surface_next_wallpaper:
    url: http://127.0.0.1:8000/api/wallpapers/next
    method: POST

  surface_set_night_mode:
    url: http://127.0.0.1:8000/api/night-mode
    method: POST
    content_type: application/json
    payload: '{"enabled": {{ enabled | tojson }}}'

  surface_set_sleep_timer:
    url: http://127.0.0.1:8000/api/sleep-timer
    method: POST
    content_type: application/json
    payload: '{"minutes": {{ minutes | int }}}'

  surface_send_sms:
    url: http://127.0.0.1:8000/api/kde/sms
    method: POST
    content_type: application/json
    payload: '{"recipient": "{{ recipient }}", "message": "{{ message }}"}'

  surface_reply_whatsapp:
    url: http://127.0.0.1:8000/api/kde/reply
    method: POST
    content_type: application/json
    payload: '{"sender": "{{ sender }}", "message": "{{ message }}"}'
